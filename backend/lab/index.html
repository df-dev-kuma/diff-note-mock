<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiffNote ラボ</title>
  <meta name="description" content="指示の食い違い検知を Gemini で試す検証画面">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0efe9; --text: #1f2421; --muted: #5f6661;
      --border: #dddbd2; --accent: #2f6f53; --accent-text: #ffffff; --accent-soft: #e3efe8;
      --danger: #b3261e; --danger-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fdf1d8;
      --info: #2f5d8a; --info-soft: #e6eef6; --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151816; --surface: #1d211f; --surface-2: #252a27; --text: #e8ebe8; --muted: #a2aaa5;
        --border: #343a36; --accent: #6cc39a; --accent-text: #0e1a14; --accent-soft: #20352a;
        --danger: #f2a49c; --danger-soft: #3a2220; --warn: #f0c46a; --warn-soft: #3a3020;
        --info: #9cc3ea; --info-soft: #1f2c3a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; line-height: 1.7; font-size: 15px;
    }
    header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 64px; display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
    @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
    .col { display: grid; gap: 16px; align-content: start; min-width: 0; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
    section h2 { margin: 0 0 10px; font-size: 16px; }
    section h3 { margin: 14px 0 6px; font-size: 14px; }
    .notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
    input, select, textarea, button { font: inherit; color: inherit; }
    input, select, textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    }
    textarea { min-height: 96px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1 1 140px; }
    .row > .shrink { flex: 0 0 auto; }
    button {
      border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 14px; cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
    button.small { padding: 3px 10px; font-size: 13px; }
    button:disabled { opacity: .5; cursor: wait; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .tabs button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .err { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
    .ok { color: var(--accent); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .scroll { overflow-x: auto; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 10px; }
    .card.open { border-color: var(--danger); background: var(--danger-soft); }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-right: 6px; }
    .b-contradiction { background: var(--danger); color: #fff; }
    .b-conditional { background: var(--info-soft); color: var(--info); }
    .b-update { background: var(--warn-soft); color: var(--warn); }
    .b-supplement, .b-same { background: var(--surface-2); color: var(--muted); }
    .b-resolved { background: var(--accent-soft); color: var(--accent); }
    .pair { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; margin: 6px 0; }
    .pair b { color: var(--muted); font-weight: 500; }
    .question { background: var(--surface); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 4px; margin: 6px 0; }
    .topic { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .topic:last-child { border-bottom: 0; }
    .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); max-height: 220px; overflow: auto; }
    .strike { text-decoration: line-through; color: var(--muted); }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>DiffNote ラボ</h1>
    <p>受けた指示の「食い違い」を Gemini で見つける検証画面。データとキーはこのブラウザの中にだけ保存されます。</p>
  </header>
  <main>
    <div class="col">
      <section id="settings"></section>
      <section id="input"></section>
      <section id="result"></section>
    </div>
    <div class="col">
      <section id="conflicts"></section>
      <section id="topics"></section>
      <section id="people"></section>
      <section id="log"></section>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
